<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NBA Player Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">
        <div class="container topo-conteudo">

            <div>
                <h1>NBA Player Tracker</h1>
                <p>Últimos 10 jogos dos jogadores selecionados</p>
            </div>

            <div class="contador">
                <strong id="total-jogadores">0</strong>
                <span>jogadores</span>
            </div>

        </div>
    </header>

    <main class="container">

        <section class="filtros">

            <div class="campo-busca">
                <label for="busca-jogador">Buscar jogador</label>
                <input
                    type="search"
                    id="busca-jogador"
                    placeholder="Ex.: Luka Doncic"
                    autocomplete="off"
                >
