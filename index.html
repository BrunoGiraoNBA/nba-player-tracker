<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NBA Player Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo">
    <div class="container topo-conteudo">

        <div class="marca">
            <div class="marca-bola">🏀</div>

            <div>
                <h1>NBA Player Tracker</h1>
                <p>Analise jogadores, confrontos e os últimos 10 jogos</p>
            </div>
        </div>

        <div class="contador">
            <strong id="total-jogadores">0</strong>
            <span>jogadores</span>
        </div>

    </div>
</header>


<main class="container">

    <section class="painel-filtros">

        <div class="filtro-principal">

            <label for="busca-jogador">
                Buscar jogador
            </label>

            <input
                type="search"
                id="busca-jogador"
                placeholder="Ex.: Luka Doncic"
                autocomplete="off"
            >

        </div>


        <div class="bloco-filtro">

            <div class="filtro-titulo">
                <div>
                    <span class="filtro-label">
                        Times
                    </span>

                    <small>
                        Selecione um ou mais times
                    </small>
                </div>

                <button
                    type="button"
                    id="limpar-times"
                    class="botao-texto"
                >
                    Limpar times
                </button>
            </div>

            <div
                id="lista-times"
                class="lista-opcoes"
            >
            </div>

        </div>


        <div class="bloco-filtro">

            <div class="filtro-titulo">
                <div>
                    <span class="filtro-label">
                        Jogadores
                    </span>

                    <small>
                        Monte sua análise personalizada
                    </small>
                </div>

                <button
                    type="button"
                    id="limpar-jogadores"
                    class="botao-texto"
                >
                    Limpar jogadores
                </button>
            </div>

            <div class="seletor-jogadores">

                <select id="seletor-jogador">
                    <option value="">
                        Selecione um jogador
                    </option>
                </select>

                <button
                    type="button"
                    id="adicionar-jogador"
                    class="botao-primario"
                >
                    + Adicionar
                </button>

            </div>

            <div
                id="jogadores-selecionados"
                class="chips-selecionados"
            >
            </div>

        </div>


        <div class="barra-acoes">

            <div class="resumo-selecao">

                <strong id="quantidade-selecionados">
                    0
                </strong>

                <span>
                    jogadores selecionados
                </span>

            </div>

            <div class="acoes-direita">

                <button
                    type="button"
                    id="mostrar-todos"
                    class="botao-secundario ativo"
                >
                    Mostrar filtrados
                </button>

                <button
                    type="button"
                    id="mostrar-selecionados"
                    class="botao-secundario"
                >
                    Somente selecionados
                </button>

                <button
                    type="button"
                    id="limpar-tudo"
                    class="botao-perigo"
                >
                    Limpar tudo
                </button>

            </div>

        </div>

    </section>


    <section class="status">
        <span id="status-texto">
            Carregando jogadores...
        </span>
    </section>


    <section
        id="lista-jogadores"
        class="lista-jogadores"
    >
    </section>


    <section
        id="sem-resultados"
        class="sem-resultados"
        hidden
    >
        Nenhum jogador encontrado com os filtros selecionados.
    </section>

</main>


<template id="template-jogador">

    <article class="jogador-card">

        <div class="jogador-cabecalho">

            <div class="jogador-identificacao">

                <div class="jogador-time">
                </div>

                <div>

                    <h2 class="jogador-nome">
                    </h2>

                    <div class="jogador-equipe">
                    </div>

                    <span class="jogador-jogos">
                        Últimos 10 jogos
                    </span>

                </div>

            </div>


            <div class="medias">

                <div class="media">
                    <span>PTS</span>
                    <strong class="media-pts">-</strong>
                </div>

                <div class="media">
                    <span>REB</span>
                    <strong class="media-reb">-</strong>
                </div>

                <div class="media">
                    <span>AST</span>
                    <strong class="media-ast">-</strong>
                </div>

                <div class="media">
                    <span>3PM</span>
                    <strong class="media-tpm">-</strong>
                </div>

                <div class="media">
                    <span>STL</span>
                    <strong class="media-stl">-</strong>
                </div>

                <div class="media">
                    <span>BLK</span>
                    <strong class="media-blk">-</strong>
                </div>

            </div>

        </div>


        <div class="tabela-container">

            <table class="tabela-jogos">

                <thead>

                    <tr>
                        <th>Data</th>
                        <th>Adversário</th>
                        <th>MIN</th>
                        <th>PTS</th>
                        <th>REB</th>
                        <th>AST</th>
                        <th>3PM</th>
                        <th>STL</th>
                        <th>BLK</th>
                    </tr>

                </thead>

                <tbody class="jogos-corpo">
                </tbody>

            </table>

        </div>

    </article>

</template>


<script src="script.js"></script>

</body>
</html>
