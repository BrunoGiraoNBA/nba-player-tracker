name: Atualizar NBA Player Tracker

on:
  workflow_dispatch:

  schedule:
    # 08:00 no horario de Brasilia = 11:00 UTC
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar dados dos jogadores
        run: python scripts/atualizar_dados.py

      - name: Verificar alteracoes
        run: git status --short

      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados.csv

          if git diff --cached --quiet; then
            echo "dados.csv nao teve alteracoes."
            exit 0
          fi

          git commit -m "Atualizar dados NBA automaticamente"
          git push
